<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เราเล่นคำตอบของแฟน 💕</title>
<style>
body{font-family:sans-serif; text-align:center; background:linear-gradient(135deg,#ff9cc2,#ffc0cb); color:#fff;}
button{padding:10px 20px;margin:5px;border:none;border-radius:8px; cursor:pointer;}
button.correct{background:green;color:#fff;}
button.wrong{background:red;color:#fff;}
</style>
</head>
<body>
<h2>เราเล่นคำตอบของแฟน 💖</h2>
<p id="question-text"></p>
<div id="answers"></div>
<button id="next-btn">ถัดไป</button>
<p id="score"></p>

<script>
const urlParams = new URLSearchParams(window.location.search);
const questions = [
  {q:"เราพบกันครั้งแรกที่ไหน?", a:["ร้านกาแฟ","มหาวิทยาลัย","สวนสาธารณะ","ร้านหนังสือ"]},
  {q:"สีโปรดของแฟนคุณคือ?", a:["ฟ้า","ชมพู","เขียว","ม่วง"]},
  {q:"อาหารจานโปรดคืออะไร?", a:["พิซซ่า","ส้มตำ","ซูชิ","เบอร์เกอร์"]},
  {q:"ชื่อเล่นแฟนคือ?", a:["เฟอ","ช้อน","ส้อม","มิก"]},
  {q:"วันเกิดแฟนคือเดือน?", a:["ม.ค.","ก.ค.","ก.พ.","ธ.ค."]},
  {q:"สัตว์ที่แฟนชอบที่สุด?", a:["แมว","สุนัข","นก","ปลา"]},
  {q:"เพลงโปรดคือ?", a:["เพลงรัก","เพลงแดนซ์","เพลงเศร้า","เพลงสากล"]},
  {q:"สถานที่เที่ยวโปรดคือ?", a:["ทะเล","ภูเขา","เมือง","สวนสนุก"]},
  {q:"สีลิปสติกที่ชอบ?", a:["แดง","ชมพู","ส้ม","ม่วง"]},
  {q:"เครื่องดื่มโปรดคือ?", a:["ชา","กาแฟ","น้ำผลไม้","น้ำอัดลม"]}
];

// ตั้งค่าคำตอบแฟน
questions.forEach((q,i)=>q.correct = parseInt(urlParams.get(`a${i}`)));

let current = 0;
let score = 0;

const qText = document.getElementById("question-text");
const ansDiv = document.getElementById("answers");
const nextBtn = document.getElementById("next-btn");
const scoreText = document.getElementById("score");

function showQuestion(index){
  const q = questions[index];
  qText.textContent = q.q;
  ansDiv.innerHTML = '';
  q.a.forEach((ans,i)=>{
    const btn = document.createElement("button");
    btn.textContent = ans;
    btn.onclick = ()=>{
      Array.from(ansDiv.children).forEach(b=>b.disabled=true);
      if(i===q.correct){
        btn.classList.add("correct");
        score++;
      }else{
        btn.classList.add("wrong");
      }
      scoreText.textContent = `คะแนน: ${score}/${questions.length}`;
    };
    ansDiv.appendChild(btn);
  });
}

nextBtn.onclick = ()=>{
  current++;
  if(current<questions.length){
    showQuestion(current);
    scoreText.textContent='';
  }else{
    // แสดงคำตอบสุดท้าย + reset ปุ่ม
    ansDiv.innerHTML='';
    qText.textContent=`จบเกม! คะแนนของคุณคือ ${score}/${questions.length} 🎉`;
    nextBtn.textContent='เริ่มใหม่';
    nextBtn.onclick = ()=>{
      current=0;
      score=0;
      nextBtn.textContent='ถัดไป';
      showQuestion(current);
      scoreText.textContent='';
      // กำหนด onclick กลับ
      nextBtn.onclick = arguments.callee;
    };
  }
};
</script>
</body>
</html>
