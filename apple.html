<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery 💖</title>
<style>
body { margin:0; font-family: 'Arial', sans-serif; background:#ffe6f0; display:flex; justify-content:center; align-items:center; height:100vh; }
.gallery-container { position: relative; max-width:600px; width:90%; text-align:center; }
.gallery-container img { width:100%; height:auto; border-radius:15px; object-fit:cover; box-shadow: 0 5px 20px rgba(0,0,0,0.2); }
button { position:absolute; top:50%; transform:translateY(-50%); background:#ff1493; color:#fff; border:none; padding:12px 20px; font-size:1rem; border-radius:50px; cursor:pointer; opacity:0.8; transition:0.3s; }
button:hover { opacity:1; }
#prev { left:-70px; }
#next { right:-70px; }
.back-btn { position:absolute; top:20px; left:20px; background:#fff0f5; color:#ff1493; border:none; padding:10px 15px; border-radius:12px; font-weight:bold; cursor:pointer; box-shadow:0 4px 10px rgba(0,0,0,0.1); transition:0.3s; }
.back-btn:hover { transform:scale(1.05); }
</style>
</head>
<body>

<div class="gallery-container">
  <button id="prev">&#10094;</button>
  <img id="slide-img" src="images/2.avif" alt="Memory">
  <button id="next">&#10095;</button>
  <button class="back-btn" onclick="window.location.href='index.html'">กลับหน้าแรก</button>
</div>

<script>
// ลิสต์รูปภาพ
const urlParams = new URLSearchParams(window.location.search);
let current = parseInt(urlParams.get('start')) || 0; // ถ้าไม่มี start จะเริ่ม 0
showSlide(current);

const slideImg = document.getElementById("slide-img");
const prevBtn = document.getElementById("prev");
const nextBtn = document.getElementById("next");

function showSlide(index){
  slideImg.src = images[index];
}

// ปุ่ม Next
nextBtn.addEventListener("click", ()=>{
  current = (current + 1) % images.length;
  showSlide(current);
});

// ปุ่ม Prev
prevBtn.addEventListener("click", ()=>{
  current = (current - 1 + images.length) % images.length;
  showSlide(current);
});
</script>
</body>
</html>
